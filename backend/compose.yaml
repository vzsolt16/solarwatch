version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: solarwatch-sql
    environment:
      SA_PASSWORD: "Mystrongpassword0"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: ./SolarWatch
      dockerfile: Dockerfile
    container_name: solarwatch-api
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SolarWatchDb;User Id=sa;Password=Mystrongpassword0;TrustServerCertificate=True"

volumes:
  sql_data: